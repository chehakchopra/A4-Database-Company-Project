<!DOCTYPE html>
<html>

<head>
    <title>Add Employee</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
    {% endif %}
    {% endwith %}

    <div class="container">
        <h1>Add Employee</h1>

        <form method="POST" class="remove_background">
            <label>First Name</label>
            <input name="fname" required>

            <label>Middle Initial</label>
            <input name="minit" maxlength="1" required>

            <label>Last Name</label>
            <input name="lname" required>

            <label>SSN</label>
            <input name="ssn" required maxlength="9">

            <label>Address</label>
            <input name="address" required>

            <label>Sex</label>
            <select name="sex">
                <option>M</option>
                <option>F</option>
            </select>

            <label>Salary</label>
            <input name="salary" type="number" required>

            <label>Supervisor</label>
            <select name="super_ssn">
                <option value="">None</option>
                {% for s in supervisors %}
                <option value="{{ s[0] }}">{{ s[1] }}</option>
                {% endfor %}
            </select>

            <label>Department</label>
            <select name="dno" required>
                {% for d in departments %}
                <option value="{{ d[0] }}">{{ d[1] }}</option>
                {% endfor %}
            </select>

            <label>Birth Date</label>
            <input type="date" name="bdate" required>

            <label>Employment Date</label>
            <input type="date" name="empdate" required>

            <button type="submit">Add Employee</button>
        </form>
    </div>

</body>

</html>
