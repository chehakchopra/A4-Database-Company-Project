{% extends "layout.html" %}
{% block content %}
<h2>Add Employee</h2>

<form method="post">
  <div>
    <label>First Name:</label><br>
    <input type="text" name="fname" required>
  </div>
  <div>
    <label>Middle Initial:</label><br>
    <input type="text" name="minit" maxlength="1" required>
  </div>
  <div>
    <label>Last Name:</label><br>
    <input type="text" name="lname" required>
  </div>
  <div>
    <label>SSN:</label><br>
    <input type="text" name="ssn" maxlength="9" required>
  </div>
  <div>
    <label>Address:</label><br>
    <input type="text" name="address" required>
  </div>
  <div>
    <label>Sex:</label><br>
    <select name="sex" required>
      <option value="M">M</option>
      <option value="F">F</option>
    </select>
  </div>
  <div>
    <label>Salary:</label><br>
    <input type="number" name="salary" required>
  </div>
  <div>
    <label>Supervisor:</label><br>
    <select name="super_ssn">
      <option value="">None</option>
      {% for sup in supervisors %}
        <option value="{{ sup[0] }}">{{ sup[1] }} ({{ sup[0] }})</option>
      {% endfor %}
    </select>
  </div>
  <div>
    <label>Department:</label><br>
    <select name="dno" required>
      {% for dept in departments %}
        <option value="{{ dept[0] }}">{{ dept[1] }}</option>
      {% endfor %}
    </select>
  </div>
  <div>
    <label>Birth Date:</label><br>
    <input type="date" name="bdate" required>
  </div>
  <div>
    <label>Employment Date:</label><br>
    <input type="date" name="empdate" required>
  </div>

  <button type="submit" style="margin-top:10px;">Save</button>
  <a href="{{ url_for('employees') }}" style="margin-left:10px;">Cancel</a>
</form>
{% endblock %}
