{% extends "layout.html" %}
{% block content %}

<h1>Managers Overview</h1>

<table>

  <thead>
    <tr>
      <th>Department Name</th>
      <th>Department Number</th>
      <th>Manager</th>
      <th>Employee Count</th>
      <th>Total Hours</th>
    </tr>
  </thead>

  <tbody>
    {% for row in managers %}
    <tr>
      <td>{{ row[0] }}</td>
      <td>{{ row[1] }}</td>
      <td>{{ row[2] }}</td>
      <td>{{ row[3] }}</td>
      <td>{{ row[4] }}</td>
    </tr>
    {% endfor %}
  </tbody>
  
</table>

<p style="margin-top:15px;">
  <a href="{{ url_for('home') }}">Back to Home</a>
</p>

{% endblock %}
