{% extends "layout.html" %}
{% block content %}

<h1>Projects Overview</h1>

<div>

  <form method="get" action="{{ url_for('projects') }}">

    <div style="display: flex; flex-wrap:wrap; gap:20px;">

      <div style="display: flex; flex-direction: column;">
        <label for="search_name">Search by Project Name:</label>
        <input type="text" id="search_name" name="search_name" value="{{ search_name }}"
          placeholder="Enter project name">
      </div>

      <div style="display: flex; flex-direction: column;">
        <label for="department">Department:</label>
        <select id="department" name="department">
          <option value="">All Departments</option>
          {% for dept in departments %}
          <option value="{{ dept }}" {% if dept==selected_dept %}selected{% endif %}>{{ dept }}</option>
          {% endfor %}
        </select>
      </div>

      <div style="display: flex; flex-direction: column;">
        <label for="sort_by">Sort By:</label>
        <select id="sort_by" name="sort_by">
          <option value="">None</option>
          <option value="headcount" {% if sort_by=="headcount" %}selected{% endif %}>Headcount</option>
          <option value="hours" {% if sort_by=="hours" %}selected{% endif %}>Total Hours</option>
        </select>
      </div>

      <div style="display: flex; flex-direction: column;">
        <label for="sort_dir">Direction:</label>
        <select id="sort_dir" name="sort_dir">
          <option value="asc" {% if sort_dir=="asc" %}selected{% endif %}>Ascending</option>
          <option value="desc" {% if sort_dir=="desc" %}selected{% endif %}>Descending</option>
        </select>
      </div>

      <div style="align-self: flex-end;">
        <button type="submit" style="padding:6px 14px;">Apply</button>
      </div>
    </div>
    <a href="{{ url_for('projects') }}">Reset Filters</a>

  </form>
</div>

<table>

  <thead>
    <tr>
      <th>Project Name</th>
      <th>Department</th>
      <th>Headcount</th>
      <th>Total Hours</th>
    </tr>
  </thead>
  
  <tbody>
    {% for proj in projects %}
    <tr>
      <td> <a href="/projects/{{proj[0]}}"> {{ proj[1] }} </a> </td>
      <td>{{ proj[2] }}</td>
      <td>{{ proj[3] }}</td>
      <td>{{ proj[4] }}</td>
    </tr>
    {% endfor %}
  </tbody>

</table>

<p><a href="{{ url_for('home') }}">Back to Home</a></p>
{% endblock %}
