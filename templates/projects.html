{% extends "layout.html" %}
{% block content %}
<h2>Project Overview</h2>

<form method="get" action="{{ url_for('projects') }}" style="margin-bottom: 20px;">
  <label for="search_name">Search by Project Name:</label>
  <input type="text" id="search_name" name="search_name" value="{{ search_name }}" placeholder="Enter project name">

  <label for="department">Department:</label>
  <select id="department" name="department">
    <option value="">All Departments</option>
    {% for dept in departments %}
      <option value="{{ dept }}" {% if dept == selected_dept %}selected{% endif %}>{{ dept }}</option>
    {% endfor %}
  </select>

  <button type="submit">Filter</button>
  <a href="{{ url_for('projects') }}">Reset</a>
</form>

<table border="1" cellpadding="8" cellspacing="0">
  <tr>
    <th>Project Number</th>
    <th>Project Name</th>
    <th>Department</th>
    <th>Total Employees</th>
    <th>Total Hours</th>
  </tr>
  {% for proj in projects %}
  <tr>
    <td>{{ proj[0] }}</td>
    <td>{{ proj[1] }}</td>
    <td>{{ proj[2] }}</td>
    <td>{{ proj[3] }}</td>
    <td>{{ proj[4] }}</td>
  </tr>
  {% endfor %}
</table>

<p><a href="{{ url_for('home') }}">Back to Home</a></p>
{% endblock %}
