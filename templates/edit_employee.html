{% extends "layout.html" %}
{% block content %}
<h2>Edit Employee: {{ emp[0] }} {{ emp[1] }}. {{ emp[2] }} </h2>

<form method="post">
  <p><strong>SSN:</strong> {{ emp[3] }}</p>

  <div>
    <label>Address:</label><br>
    <input type="text" name="address" value="{{ emp[4] }}" required>
  </div>

  <div>
    <label>Salary:</label><br>
    <input type="number" name="salary" value="{{ emp[6] }}" required>
  </div>

  <div>
    <label>Department:</label><br>
    <select name="dno" required>
      {% for dept in departments %}
      <option value="{{ dept[0] }}" {% if dept[0]==emp[8] %}selected{% endif %}>
        {{ dept[1] }}
      </option>
      {% endfor %}
    </select>
  </div>

  <div>
    <label>Supervisor:</label><br>
    <select name="super_ssn">
      <option value="">None</option>
      {% for sup in supervisors %}
      <option value="{{ sup[0] }}" {% if sup[0]==emp[7] %}selected{% endif %}>
        {{ sup[1] }}
      </option>
      {% endfor %}
    </select>
  </div>

  <button type="submit" style="margin-top:10px;">Save</button>
  <a href="{{ url_for('employees') }}" style="margin-left:10px;">Cancel</a>
</form>
{% endblock %}
