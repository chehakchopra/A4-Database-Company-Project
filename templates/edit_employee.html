<!DOCTYPE html>
<html>

<head>
    <title>Edit Employee</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
    {% endif %}
    {% endwith %}

    <div class="container">
        <h1>Edit Employee ({{ emp[3] }}, {{ emp[0] }} {{ emp[1] }} {{ emp[2] }})</h1>

        <form method="POST" class="remove_background">
            <label>Address</label>
            <input name="address" value="{{ emp[4] }}" required>

            <label>Salary</label>
            <input name="salary" type="number" value="{{ emp[6] }}" required>

            <label>Supervisor</label>
            <select name="super_ssn">
                <option value="">None</option>
                {% for s in supervisors %}
                <option value="{{ s[0] }}" {% if s[0]==emp[7] %}selected{% endif %}>{{ s[1] }}</option>
                {% endfor %}
            </select>

            <label>Department</label>
            <select name="dno">
                {% for d in departments %}
                <option value="{{ d[0] }}" {% if emp[8]==d[0] %}selected{% endif %}>
                    {{ d[1] }}
                </option>
                {% endfor %}
            </select>

            <button type="submit">Save Changes</button>
        </form>
    </div>

</body>

</html>
